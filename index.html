<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f1;
            color: #2b2b2b;
            /* Subtle dot-grid texture */
            background-image: radial-gradient(#d1d1d3 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* Monochrome glassmorphism card styling */
        .contact-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(215, 215, 218, 0.8);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }
        .contact-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.98);
            border-color: #71717a;
            box-shadow: 0 8px 25px -4px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">

    <div class="w-full max-w-2xl bg-white/90 backdrop-blur-xl border border-zinc-200/80 shadow-[0_20px_50px_rgba(0,0,0,0.08)] rounded-[2.5rem] p-6 sm:p-10 relative overflow-hidden">
        
        <!-- Atmospheric banner header -->
        <div class="mb-6 rounded-2xl overflow-hidden border border-zinc-200 shadow-sm relative h-36 sm:h-44">

                <span class="text-white text-xs font-medium tracking-widest uppercase bg-black/40 backdrop-blur-md px-3 py-1 rounded-full border border-white/20">
                    🖤 contact channel 🤍
                </span>
            </div>
        </div>

        <!-- Header section -->
        <div class="text-center mb-8 relative z-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-zinc-900 tracking-tight">Contact</h1>
            <p class="text-zinc-500 text-sm sm:text-base mt-2">✨ ช่องทางการติดต่อทั้งหมด เลือกช่องทางที่สะดวกได้เลยค่ะ 🕊️</p>
        </div>

            <!-- Line -->

                <div class="w-12 h-12 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-800 text-xl group-hover:scale-105 transition-transform border border-zinc-200">
                    <i class="fa-brands fa-line"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-semibold text-zinc-400 group-hover:text-zinc-900 transition-colors uppercase tracking-wider">Line</h2>
                    <p class="text-base sm:text-lg font-bold text-zinc-800 tracking-wide">@465wgmrd</p>
                </div>
                <div class="text-zinc-300 group-hover:text-zinc-800 transition-colors">

                    <h2 class="text-xs font-semibold text-zinc-400 group-hover:text-zinc-900 transition-colors uppercase tracking-wider">X</h2>

                <div class="ml-4 flex-1">

            <!-- Discord -->
            <a href="https://discord.gg/vNHyuk3N" target="_blank" rel="noopener noreferrer" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-800 text-xl group-hover:scale-105 transition-transform border border-zinc-200">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-semibold text-zinc-400 group-hover:text-zinc-900 transition-colors uppercase tracking-wider">Discord</h2>
                    <p class="text-base sm:text-lg font-bold text-zinc-800 tracking-wide">summerluvcat</p>
                </div>
                <div class="text-zinc-300 group-hover:text-zinc-800 transition-colors">

            <!-- Gmail -->
            <a href="mailto:summerluvcapi@gmail.com" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group sm:col-span-2">

                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="ml-4 flex-1 overflow-hidden">
                    <h2 class="text-xs font-semibold text-zinc-400 group-hover:text-zinc-900 transition-colors uppercase tracking-wider">Gmail</h2>
                    <p class="text-xs sm:text-sm font-bold text-zinc-800 tracking-wide truncate">summerluvcapi@gmail.com</p>

        <!-- Footer note -->
