<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f6f2;
            color: #7a706b;
        }
        /* Soft aesthetic pastel card styling matching image_2 */
        .contact-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
            border: 1px solid rgba(226, 221, 213, 0.6);
            box-shadow: 0 4px 20px -2px rgba(180, 175, 165, 0.08);
        }
        .contact-card:hover {
            transform: translateY(-3px);
            background: #fdfbf7;
            border-color: #d1ccbe;
            box-shadow: 0 8px 25px -4px rgba(180, 175, 165, 0.15);
        }
        .aesthetic-header-bg {
            background: linear-gradient(135deg, rgba(200, 214, 198, 0.4) 0%, rgba(238, 224, 218, 0.4) 100%);
        }
        .sage-badge {
            background-color: #d2ded0;
            color: #586856;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">

    <div class="w-full max-w-2xl bg-[#fffefc] border border-[#eeebe3] shadow-[0_15px_40px_-10px_rgba(180,175,165,0.2)] rounded-[2.5rem] p-6 sm:p-10 relative overflow-hidden">
        
        <!-- Background decorative elements matching soft pastel tone -->
        <div class="absolute -top-24 -right-24 w-56 h-56 bg-[#e4ede2] rounded-full mix-blend-multiply filter blur-3xl opacity-60 pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-56 h-56 bg-[#f4eae6] rounded-full mix-blend-multiply filter blur-3xl opacity-60 pointer-events-none"></div>

        <!-- Header section with aesthetic touch -->
        <div class="text-center mb-8 sm:mb-10 relative z-10">
            <span class="inline-block px-4 py-1.5 mb-3 text-xs font-medium tracking-widest uppercase sage-badge rounded-full">
                ♡ contact ♡
            </span>
            <h1 class="text-3xl sm:text-4xl font-bold text-[#635a55] tracking-tight">Contact</h1>
            <p class="text-[#968c85] text-sm sm:text-base mt-2">✨ ช่องทางการติดต่อทั้งหมด เลือกช่องทางที่สะดวกได้เลยค่ะ 🐰</p>
        </div>

        <!-- 2-Column Grid matching user's sketch and image layout -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5 relative z-10">
            
            <!-- Column 1, Row 1: Line -->
            <a href="https://line.me" target="_blank" rel="noopener noreferrer" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-[#eaf2e8] flex items-center justify-center text-[#618a5e] text-xl group-hover:scale-105 transition-transform">
                    <i class="fa-brands fa-line"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-medium text-[#ab9f97] group-hover:text-[#618a5e] transition-colors uppercase tracking-wider">Line</h2>
                    <p class="text-base sm:text-lg font-semibold text-[#635a55] tracking-wide">@yourlineid</p>
                </div>
                <div class="text-[#c7bfb5] group-hover:text-[#618a5e] transition-colors">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

            <!-- Column 2, Row 1: X -->
            <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-[#f0ede6] flex items-center justify-center text-[#635a55] text-xl group-hover:scale-105 transition-transform">
                    <i class="fa-brands fa-x-twitter"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-medium text-[#ab9f97] group-hover:text-[#635a55] transition-colors uppercase tracking-wider">X</h2>
                    <p class="text-base sm:text-lg font-semibold text-[#635a55] tracking-wide">@yourhandle</p>
                </div>
                <div class="text-[#c7bfb5] group-hover:text-[#635a55] transition-colors">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

            <!-- Column 1, Row 2: Facebook -->
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-[#eaf0f7] flex items-center justify-center text-[#5879a8] text-xl group-hover:scale-105 transition-transform">
                    <i class="fa-brands fa-facebook-f"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-medium text-[#ab9f97] group-hover:text-[#5879a8] transition-colors uppercase tracking-wider">Facebook</h2>
                    <p class="text-base sm:text-lg font-semibold text-[#635a55] tracking-wide">Your Page Name</p>
                </div>
                <div class="text-[#c7bfb5] group-hover:text-[#5879a8] transition-colors">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

            <!-- Column 2, Row 2: Instagram -->
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-[#faedf3] flex items-center justify-center text-[#a86185] text-xl group-hover:scale-105 transition-transform">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-medium text-[#ab9f97] group-hover:text-[#a86185] transition-colors uppercase tracking-wider">Instargram</h2>
                    <p class="text-base sm:text-lg font-semibold text-[#635a55] tracking-wide">@your_ig</p>
                </div>
                <div class="text-[#c7bfb5] group-hover:text-[#a86185] transition-colors">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

            <!-- Column 1, Row 3: Tiktok -->
            <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-[#edece9] flex items-center justify-center text-[#4a4542] text-xl group-hover:scale-105 transition-transform">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-medium text-[#ab9f97] group-hover:text-[#4a4542] transition-colors uppercase tracking-wider">Tiktok</h2>
                    <p class="text-base sm:text-lg font-semibold text-[#635a55] tracking-wide">@yourtiktok</p>
                </div>
                <div class="text-[#c7bfb5] group-hover:text-[#4a4542] transition-colors">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

            <!-- Column 2, Row 3: Gmail -->
            <a href="mailto:contact@example.com" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-[#faecec] flex items-center justify-center text-[#b06161] text-xl group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="ml-4 flex-1 overflow-hidden">
                    <h2 class="text-xs font-medium text-[#ab9f97] group-hover:text-[#b06161] transition-colors uppercase tracking-wider">Gmail</h2>
                    <p class="text-sm sm:text-base font-semibold text-[#635a55] tracking-wide truncate">hello@example.com</p>
                </div>
                <div class="text-[#c7bfb5] group-hover:text-[#b06161] transition-colors ml-2">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

        </div>

        <!-- Footer note -->
        <div class="mt-8 text-center text-xs text-[#b8b0a6] border-t border-[#eeebe3] pt-6">
            - 🤍 ∞ · contact · 🪶 -
        </div>

    </div>

</body>
</html>
