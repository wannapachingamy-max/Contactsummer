<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f1;
            color: #2b2b2b;
            /* Subtle dot-grid texture matching image_3 */
            background-image: radial-gradient(#d1d1d3 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* Monochrome glassmorphism card styling matching image_3, image_4, image_5 */
        .contact-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(215, 215, 218, 0.8);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }
        .contact-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.98);
            border-color: #71717a;
            box-shadow: 0 8px 25px -4px rgba(0, 0, 0, 0.1);
        }
        .monochrome-badge {
            background-color: #e4e4e7;
            color: #27272a;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">

    <div class="w-full max-w-2xl bg-white/90 backdrop-blur-xl border border-zinc-200/80 shadow-[0_20px_50px_rgba(0,0,0,0.08)] rounded-[2.5rem] p-6 sm:p-10 relative overflow-hidden">
        
        <!-- Atmospheric banner header matching monochrome aesthetic -->
        <div class="mb-6 rounded-2xl overflow-hidden border border-zinc-200 shadow-sm relative h-36 sm:h-44">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop" 
                 onerror="this.src='https://placehold.co/600x200/e4e4e7/71717a?text=SUMMER+ATMOSPHERE'"
                 alt="Atmosphere Banner" class="w-full h-full object-cover grayscale contrast-125">
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent flex items-end p-4 sm:p-6">
                <span class="text-white text-xs font-medium tracking-widest uppercase bg-black/40 backdrop-blur-md px-3 py-1 rounded-full border border-white/20">
                    🖤 contact channel 🤍
                </span>
            </div>
        </div>

        <!-- Header section -->
        <div class="text-center mb-8 relative z-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-zinc-900 tracking-tight">Contact</h1>
            <p class="text-zinc-500 text-sm sm:text-base mt-2">✨ ช่องทางการติดต่อทั้งหมด เลือกช่องทางที่สะดวกได้เลยค่ะ 🕊️</p>
        </div>

        <!-- 2-Column Grid matching sketch and layout -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5 relative z-10">
            
            <!-- Column 1, Row 1: Line -->
            <a href="https://line.me" target="_blank" rel="noopener noreferrer" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-800 text-xl group-hover:scale-105 transition-transform border border-zinc-200">
                    <i class="fa-brands fa-line"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-semibold text-zinc-400 group-hover:text-zinc-900 transition-colors uppercase tracking-wider">Line</h2>
                    <p class="text-base sm:text-lg font-bold text-zinc-800 tracking-wide">@yourlineid</p>
                </div>
                <div class="text-zinc-300 group-hover:text-zinc-800 transition-colors">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

            <!-- Column 2, Row 1: X -->
            <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-800 text-xl group-hover:scale-105 transition-transform border border-zinc-200">
                    <i class="fa-brands fa-x-twitter"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-semibold text-zinc-400 group-hover:text-zinc-900 transition-colors uppercase tracking-wider">X</h2>
                    <p class="text-base sm:text-lg font-bold text-zinc-800 tracking-wide">@yourhandle</p>
                </div>
                <div class="text-zinc-300 group-hover:text-zinc-800 transition-colors">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

            <!-- Column 1, Row 2: Facebook -->
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-800 text-xl group-hover:scale-105 transition-transform border border-zinc-200">
                    <i class="fa-brands fa-facebook-f"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-semibold text-zinc-400 group-hover:text-zinc-900 transition-colors uppercase tracking-wider">Facebook</h2>
                    <p class="text-base sm:text-lg font-bold text-zinc-800 tracking-wide">Your Page Name</p>
                </div>
                <div class="text-zinc-300 group-hover:text-zinc-800 transition-colors">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

            <!-- Column 2, Row 2: Instagram -->
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-800 text-xl group-hover:scale-105 transition-transform border border-zinc-200">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-semibold text-zinc-400 group-hover:text-zinc-900 transition-colors uppercase tracking-wider">Instargram</h2>
                    <p class="text-base sm:text-lg font-bold text-zinc-800 tracking-wide">@your_ig</p>
                </div>
                <div class="text-zinc-300 group-hover:text-zinc-800 transition-colors">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

            <!-- Column 1, Row 3: Tiktok -->
            <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-800 text-xl group-hover:scale-105 transition-transform border border-zinc-200">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <div class="ml-4 flex-1">
                    <h2 class="text-xs font-semibold text-zinc-400 group-hover:text-zinc-900 transition-colors uppercase tracking-wider">Tiktok</h2>
                    <p class="text-base sm:text-lg font-bold text-zinc-800 tracking-wide">@yourtiktok</p>
                </div>
                <div class="text-zinc-300 group-hover:text-zinc-800 transition-colors">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

            <!-- Column 2, Row 3: Gmail -->
            <a href="mailto:contact@example.com" class="contact-card flex items-center p-4 sm:p-5 rounded-2xl group">
                <div class="w-12 h-12 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-800 text-xl group-hover:scale-105 transition-transform border border-zinc-200">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="ml-4 flex-1 overflow-hidden">
                    <h2 class="text-xs font-semibold text-zinc-400 group-hover:text-zinc-900 transition-colors uppercase tracking-wider">Gmail</h2>
                    <p class="text-sm sm:text-base font-bold text-zinc-800 tracking-wide truncate">hello@example.com</p>
                </div>
                <div class="text-zinc-300 group-hover:text-zinc-800 transition-colors ml-2">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

        </div>

        <!-- Footer note -->
        <div class="mt-8 text-center text-xs text-zinc-400 border-t border-zinc-200 pt-6">
            🖤 · contact · 🤍
        </div>

    </div>

</body>
</html>
