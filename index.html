<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        body {
            background-color: #f3f3f3;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            border: 1px solid #e5e5e5;
        }

        /* แบนเนอร์ด้านบน */
        .banner-container {
            width: 100%;
            height: 190px;
            position: relative;
            overflow: hidden;
        }

        .banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(110%);
        }

        .banner-tag {
            position: absolute;
            bottom: 14px;
            left: 16px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* ส่วนหัวข้อ */
        .header-section {
            padding: 24px 20px 16px 20px;
            text-align: center;
        }

        .main-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #777777;
            margin-bottom: 20px;
        }

        /* ตาราง 2 คอลัมน์ */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 20px 24px 20px;
        }

        .contact-card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 16px;
            padding: 14px 12px;
            text-decoration: none;
            color: #333333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .contact-card:hover {
            border-color: #cbd5e1;
            background: #fafafa;
            transform: translateY(-2px);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .icon-box {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #f4f4f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .text-box {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-label {
            font-size: 10px;
            font-weight: 700;
            color: #9ca3af;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow {
            font-size: 12px;
            color: #9ca3af;
            flex-shrink: 0;
            margin-left: 4px;
        }

        /* ฟุตเตอร์ */
        .footer {
            text-align: center;
            padding: 0 0 20px 0;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แบนเนอร์ -->
        <div class="banner-container">
            <img src="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=600&auto=format&fit=crop" alt="Banner" class="banner">
            <div class="banner-tag">🤍 CONTACT CHANNEL 🤍</div>
        </div>

        <!-- หัวข้อ -->
        <div class="header-section">
            <h1 class="main-title">Contact</h1>
            <p class="subtitle">✨ ช่องทางการติดต่อทั้งหมด เลือกช่องทางที่สะดวกได้เลยค่ะ 🕊️</p>
        </div>

        <!-- การ์ดช่องทางติดต่อ 2 คอลัมน์ พร้อมลิงก์จริง -->
        <div class="contact-grid">
            <!-- Line -->
            <a href="https://lin.ee/xMpT4kF" target="_blank" class="contact-card">
                <div class="card-left">
                    <div class="icon-box"><i class="fa-brands fa-line" style="color: #06c755;"></i></div>
                    <div class="text-box">
                        <span class="card-label">LINE</span>
                        <span class="card-value">@yourlineid</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <!-- X -->
            <a href="https://x.com/summerluvcat?s=11" target="_blank" class="contact-card">
                <div class="card-left">
                    <div class="icon-box"><i class="fa-brands fa-x-twitter" style="color: #000000;"></i></div>
                    <div class="text-box">
                        <span class="card-label">X</span>
                        <span class="card-value">@yourhandle</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/share/19irMwU74a/?mibextid=wwXIfr" target="_blank" class="contact-card">
                <div class="card-left">
                    <div class="icon-box"><i class="fa-brands fa-facebook" style="color: #0866ff;"></i></div>
                    <div class="text-box">
                        <span class="card-label">FACEBOOK</span>
                        <span class="card-value">Your Page Name</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <!-- Instargram -->
            <a href="#" target="_blank" class="contact-card">
                <div class="card-left">
                    <div class="icon-box"><i class="fa-brands fa-instagram" style="color: #e1306c;"></i></div>
                    <div class="text-box">
                        <span class="card-label">INSTARGRAM</span>
                        <span class="card-value">@your_ig</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <!-- Tiktok -->
            <a href="https://www.tiktok.com/@sum.kawaii?_r=1&_d=secCgYIASAHKAESPgo8uMhbbSHMow2iSuih4Y%2FwjurYD0HhjF5lXn4klDBtu1884%2BEGBT51ykGC1NATgpXaO6hyTpoXm6IZ%2FgD%2BGgA%3D&_svg=1&checksum=8c22ff25dea4b5b8af417cced160beaf8752e6ec54464fbb0f7cad5ffa03e84c&item_author_type=1&panel_source_v2=share_panel&reflow_sign_scene=7&rgssign=8.1.42nPI9loTAF_yYj3r-JSkA&sec_uid=MS4wLjABAAAAQ7lVtMN-tsUBxz6sKHTZTp6tzLKwOJS-feXmArB-mynXeoSV429k3PC3tbMeyFA4&sec_user_id=MS4wLjABAAAAQ7lVtMN-tsUBxz6sKHTZTp6tzLKwOJS-feXmArB-mynXeoSV429k3PC3tbMeyFA4&share_app_id=1180&share_author_id=7472685106571494416&share_enter_from=personal_homepage&share_link_id=0DCA7F38-1324-4195-9564-F59A17DEB55A&share_region=TH&share_scene=1&sharer_language=en&social_share_type=5&source=h5_t&timestamp=1790573609&tt_from=copy&u_code=eimi2lhkk41k10&ug_btm=b0&user_id=7472685106571494416&utm_campaign=client_share&utm_medium=ios&utm_source=copy" target="_blank" class="contact-card">
                <div class="card-left">
                    <div class="icon-box"><i class="fa-brands fa-tiktok" style="color: #000000;"></i></div>
                    <div class="text-box">
                        <span class="card-label">TIKTOK</span>
                        <span class="card-value">@yourtiktok</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <!-- Gmail -->
            <a href="mailto:your-email@gmail.com" class="contact-card">
                <div class="card-left">
                    <div class="icon-box"><i class="fa-solid fa-envelope" style="color: #ea4335;"></i></div>
                    <div class="text-box">
                        <span class="card-label">GMAIL</span>
                        <span class="card-value">hello@example.c...</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>
        </div>

        <div class="footer">
            <span>🤍 contact 🤍</span>
        </div>
    </div>

</body>
</html>
